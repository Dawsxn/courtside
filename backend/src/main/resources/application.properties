spring.application.name=courtside

# --- database ---------------------------------------------------------------
# Defaults match docker-compose.yml at the repo root, so local dev needs no
# setup. Deployed environments set DATABASE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/courtside}
spring.datasource.username=${DATABASE_USERNAME:courtside}
spring.datasource.password=${DATABASE_PASSWORD:courtside}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside services, not lazily during JSON serialization.
spring.jpa.open-in-view=false

# --- API --------------------------------------------------------------------
spring.mvc.problemdetails.enabled=true
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.path=/api/v1/docs

# --- ops --------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
